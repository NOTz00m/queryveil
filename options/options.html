<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QueryVeil Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>QueryVeil Settings</h1>
      <p>Configure privacy-preserving search behavior</p>
    </div>

    <div class="content">
      <!-- General Settings -->
      <div class="section">
        <h2>General</h2>
        <div class="setting-group">
          <label for="intensity">Search Intensity</label>
          <select id="intensity">
            <option value="low">Low (~6/hr)</option>
            <option value="medium">Medium (~12/hr)</option>
            <option value="high">High (~20/hr)</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        
        <div class="setting-group" id="customRateGroup" style="display: none;">
          <label for="customRate">Queries per Hour</label>
          <input type="number" id="customRate" min="1" max="60" placeholder="12">
        </div>

        <div class="setting-group">
          <label for="searchEngine">Search Engine</label>
          <select id="searchEngine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
          </select>
        </div>

        <div class="setting-group">
          <div>
            <label>Detailed Result Clicks</label>
            <div class="help-text">Simulate clicking search results (uses more bandwidth)</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="enableResultClicks">
            <span class="slider round"></span>
          </label>
        </div>

        <div class="setting-group">
          <div>
            <label>Debug Mode</label>
            <div class="help-text">Enable verbose logging to console</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="debugMode">
            <span class="slider round"></span>
          </label>
        </div>

      </div>

      <!-- Schedule -->
      <div class="section">
        <div class="setting-group">
          <h2>Schedule</h2>
          <label class="switch">
            <input type="checkbox" id="scheduleEnabled">
            <span class="slider round"></span>
          </label>
        </div>
        
        <div id="scheduleHours" class="setting-group">
          <label>Active Hours</label>
          <div style="display: flex; align-items: center; gap: 10px;">
            <input type="number" id="startHour" min="0" max="23" placeholder="9">
            <span>to</span>
            <input type="number" id="endHour" min="0" max="23" placeholder="23">
          </div>
        </div>
      </div>

      <!-- Topics -->
      <div class="section">
        <h2>Topics</h2>
        <div class="topic-grid" id="topicGrid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Panic / Actions -->
      <div class="actions">
        <button id="saveBtn">Save Settings</button>
        <button id="panicBtn">PANIC: Stop & Clear</button>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
