<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QueryVeil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="inactive">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M8.5 12.2 10.8 14.5 15.8 9.5"/>
          </svg>
        </span>
        <span>
          <strong>QueryVeil</strong>
          <small id="versionLabel">Local search cover</small>
        </span>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Use dark theme">
        <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
        </svg>
        <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2z"></path>
        </svg>
      </button>
    </header>

    <section id="statusCard" class="status-card status-inactive" aria-live="polite">
      <div class="status-copy">
        <div class="status-line">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="statusText">Inactive</span>
        </div>
        <h1 id="statusHeading">Ready when you are</h1>
        <p id="settingsSummary">Medium pace, all topics</p>
      </div>

      <div class="score-ring-container" title="Local obfuscation estimate">
        <svg class="score-ring" viewBox="0 0 108 108" aria-hidden="true">
          <circle class="score-ring-bg" cx="54" cy="54" r="46"></circle>
          <circle id="scoreRingFill" class="score-ring-fill" cx="54" cy="54" r="46"></circle>
        </svg>
        <div class="score-inner">
          <strong id="scoreGrade">--</strong>
          <span id="scoreValue">0</span>
        </div>
      </div>
    </section>

    <div class="controls-row">
      <button id="toggleBtn" class="button button-primary" type="button">Start Veil</button>
      <button id="pauseBtn" class="button button-muted" type="button" disabled>Pause</button>
    </div>

    <section class="stats-grid" aria-label="Query statistics">
      <div class="stat-card">
        <span>Total cover</span>
        <strong id="totalQueries">0</strong>
      </div>
      <div class="stat-card">
        <span>This session</span>
        <strong id="sessionQueries">0</strong>
      </div>
      <div class="stat-card">
        <span>Pace</span>
        <strong id="paceValue">12/hr</strong>
      </div>
    </section>

    <section class="settings-card">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Quick controls</span>
          <h2>Current profile</h2>
        </div>
        <span id="saveState" class="save-state" aria-live="polite"></span>
      </div>

      <label class="config-row" for="intensitySelect">
        <span>
          <strong>Intensity</strong>
          <small>How often cover is added</small>
        </span>
        <select id="intensitySelect">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="custom">Custom</option>
        </select>
      </label>

      <label class="config-row" for="engineSelect">
        <span>
          <strong>Search engine</strong>
          <small>Where noise is sent</small>
        </span>
        <select id="engineSelect">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </label>

      <label class="config-row" for="personaSelect">
        <span>
          <strong>Ghost persona</strong>
          <small>Focus the decoy profile</small>
        </span>
        <select id="personaSelect">
          <option value="none">None</option>
        </select>
      </label>
    </section>

    <button id="settingsBtn" class="button settings-button" type="button">
      <span>Advanced Settings</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
