<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QueryVeil</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="inactive">
  <header class="bar">
    <div class="brand">
      <img src="../icons/queryveil-32.png" alt="" width="18" height="18">
      <strong>QueryVeil</strong>
      <span id="versionLabel" class="version"></span>
    </div>
    <div class="bar-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M4.6 4.6l1.1 1.1M18.3 18.3l1.1 1.1M3 12h1.5M19.5 12H21M4.6 19.4l1.1-1.1M18.3 5.7l1.1-1.1"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.5 7.5 0 0 1 9.4 4.5a7.5 7.5 0 1 0 10.1 10.1z"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="All settings" title="All settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="status" aria-live="polite">
      <div class="status-text">
        <p class="state"><span class="dot" aria-hidden="true"></span><span id="stateLabel">Off</span></p>
        <p id="stateDetail" class="detail">Nothing is being sent</p>
      </div>
      <div class="status-actions">
        <button id="pauseBtn" class="btn btn-quiet" type="button" hidden>Pause</button>
        <button id="toggleBtn" class="btn btn-primary" type="button">Start</button>
      </div>
    </section>

    <section class="activity" aria-labelledby="activityLabel">
      <div class="row-head">
        <h2 id="activityLabel">Last hour</h2>
        <span id="hourCount" class="meta">0 searches</span>
      </div>
      <svg id="strip" class="strip" viewBox="0 0 300 36" preserveAspectRatio="none" role="img" aria-label="Searches in the last hour"></svg>
      <div class="strip-scale" aria-hidden="true"><span>60 min ago</span><span>now</span></div>
      <dl class="figures">
        <div><dt>Total</dt><dd id="totalQueries">0</dd></div>
        <div><dt>Since startup</dt><dd id="sessionQueries">0</dd></div>
        <div><dt>Results opened</dt><dd id="clickCount">0</dd></div>
      </dl>
    </section>

    <details class="estimate" id="estimate">
      <summary>
        <span class="estimate-label">Cover estimate</span>
        <span class="estimate-value"><b id="scoreGrade">–</b> <span id="scoreValue">0</span></span>
        <span class="meter" aria-hidden="true"><span id="scoreBar"></span></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
      </summary>
      <ul id="factorList" class="factors"></ul>
      <p class="fine">Worked out from your settings and counters on this device. A rough guide, not a guarantee.</p>
    </details>

    <section class="quick" aria-label="Quick settings">
      <div class="field">
        <span class="field-label" id="paceLabel">Pace</span>
        <div class="segmented" role="radiogroup" aria-labelledby="paceLabel">
          <label><input type="radio" name="intensity" value="low"><span>Low</span></label>
          <label><input type="radio" name="intensity" value="medium"><span>Medium</span></label>
          <label><input type="radio" name="intensity" value="high"><span>High</span></label>
          <label><input type="radio" name="intensity" value="custom"><span>Custom</span></label>
        </div>
      </div>

      <label class="field" for="engineSelect">
        <span class="field-label">Engine</span>
        <select id="engineSelect">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </label>

      <label class="field" for="personaSelect">
        <span class="field-label">Persona</span>
        <select id="personaSelect">
          <option value="none">None, broad mix</option>
        </select>
      </label>
    </section>
  </main>

  <footer class="foot">
    <span id="saveState" class="save-state" aria-live="polite"></span>
    <button id="settingsLink" class="link-btn" type="button">All settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
