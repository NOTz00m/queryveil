<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QueryVeil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      QueryVeil
    </div>
    <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
      <!-- Sun Icon -->
      <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon Icon -->
      <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <div id="statusCard" class="status-card status-inactive">
    <div class="status-indicator"></div>
    <span id="statusText" class="status-text">Inactive</span>
  </div>

  <!-- Privacy Score Ring -->
  <div class="score-section">
    <div class="score-ring-container">
      <svg class="score-ring" viewBox="0 0 120 120">
        <circle class="score-ring-bg" cx="60" cy="60" r="52" />
        <circle id="scoreRingFill" class="score-ring-fill" cx="60" cy="60" r="52" />
      </svg>
      <div class="score-inner">
        <div id="scoreGrade" class="score-grade">—</div>
        <div id="scoreValue" class="score-value">0</div>
      </div>
    </div>
    <div class="score-label">obfuscation estimate</div>
  </div>

  <div class="controls-row">
    <button id="toggleBtn" class="btn btn-primary">Start</button>
    <button id="pauseBtn" class="btn btn-warning" disabled>Pause</button>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">Total Queries</div>
      <div id="totalQueries" class="stat-value">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Session</div>
      <div id="sessionQueries" class="stat-value">0</div>
    </div>
  </div>

  <div class="quick-config">
    <div class="config-row">
      <span>Intensity</span>
      <select id="intensitySelect" class="config-select">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="config-row">
      <span>Engine</span>
      <select id="engineSelect" class="config-select">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DDG</option>
      </select>
    </div>
    <div class="config-row">
      <span>Persona</span>
      <select id="personaSelect" class="config-select">
        <option value="none">None</option>
      </select>
    </div>
  </div>

  <div class="footer">
    <button id="settingsBtn" class="btn btn-secondary" style="width: 100%">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      Advanced Settings
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
